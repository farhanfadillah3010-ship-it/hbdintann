<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Royal Luxury Happy Birthday Suite v3.0 👑</title>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;800;900&family=Montserrat:wght@300;400;600;700&family=Pacifico&display=swap" rel="stylesheet">
    
    <style>
        /* ==========================================================================
           1. PREMIUM GLOBAL VARIABLES & CORE RESET (Luxury Themes)
           ========================================================================== */
        :root {
            --gold-primary: #d4af37;
            --gold-light: #f3e5ab;
            --gold-dark: #aa7c11;
            --obsidian: #0b0c10;
            --dark-gray: #1f2833;
            --neon-cyan: #66fcf1;
            --neon-rose: #ff007f;
            --luxury-gradient: linear-gradient(135deg, #aa7c11 0%, #f3e5ab 50%, #aa7c11 100%);
            --dark-gradient: linear-gradient(180deg, #0f0c1b 0%, #050508 100%);
            --glass: rgba(255, 255, 255, 0.03);
            --border-glow: rgba(212, 175, 55, 0.2);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Montserrat', sans-serif;
            user-select: none;
        }

        body {
            background: var(--dark-gradient);
            color: #ffffff;
            min-height: 100vh;
            overflow-x: hidden;
            position: relative;
        }

        /* Luxury Scrollbar Engine */
        ::-webkit-scrollbar {
            width: 10px;
        }
        ::-webkit-scrollbar-track {
            background: #050508;
        }
        ::-webkit-scrollbar-thumb {
            background: var(--luxury-gradient);
            border-radius: 5px;
        }

        /* ==========================================================================
           2. CANVAS EFFECTS MATRIX MANAGER (Background Magic)
           ========================================================================== */
        .fx-canvas-layer {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            pointer-events: auto; /* Biar bisa diklik buat kembang api */
            z-index: 1;
        }

        /* Decorative Golden Sparkle Overlays */
        .ambient-glow {
            position: fixed;
            width: 500px;
            height: 500px;
            background: radial-gradient(circle, rgba(212,175,55,0.08) 0%, rgba(0,0,0,0) 70%);
            top: -100px;
            left: -100px;
            pointer-events: none;
            z-index: 2;
            animation: pulseGlow 10s infinite alternate;
        }

        @keyframes pulseGlow {
            0% { transform: scale(1); opacity: 0.8; }
            100% { transform: scale(1.3); opacity: 0.4; }
        }

        /* ==========================================================================
           3. PREMIUM TOP NAVIGATION DOCK
           ========================================================================== */
        header {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            background: rgba(15, 12, 27, 0.85);
            backdrop-filter: blur(20px);
            border-bottom: 1px solid rgba(212, 175, 55, 0.2);
            z-index: 100;
            padding: 10px 0;
            box-shadow: 0 5px 30px rgba(0,0,0,0.7);
        }

        .nav-hub {
            display: flex;
            justify-content: space-between;
            align-items: center;
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 25px;
        }

        .brand-logo {
            font-family: 'Cinzel', serif;
            font-weight: 900;
            font-size: 1.5rem;
            background: var(--luxury-gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            letter-spacing: 2px;
            text-shadow: 0 0 15px rgba(214,175,55,0.3);
        }

        .nav-menu-scroller {
            display: flex;
            gap: 12px;
            overflow-x: auto;
            max-width: 75%;
            padding: 5px;
        }
        .nav-menu-scroller::-webkit-scrollbar { display: none; }

        .luxury-btn-nav {
            background: transparent;
            border: 1px solid rgba(212, 175, 55, 0.3);
            color: #ddd;
            padding: 10px 22px;
            border-radius: 4px;
            font-size: 0.85rem;
            font-weight: 600;
            letter-spacing: 1px;
            text-transform: uppercase;
            cursor: pointer;
            transition: all 0.4s cubic-bezier(0.25, 0.8, 0.25, 1);
            position: relative;
            overflow: hidden;
        }

        .luxury-btn-nav::before {
            content: '';
            position: absolute;
            top: 0; left: -100%;
            width: 100%; height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.15), transparent);
            transition: all 0.6s;
        }

        .luxury-btn-nav:hover::before { left: 100%; }

        .luxury-btn-nav.active, .luxury-btn-nav:hover {
            border-color: var(--gold-light);
            color: #000;
            background: var(--luxury-gradient);
            box-shadow: 0 0 15px rgba(212, 175, 55, 0.5);
            font-weight: 700;
        }

        /* ==========================================================================
           4. MAIN VIEWPORT ARCHITECTURE
           ========================================================================== */
        main {
            margin-top: 100px;
            padding: 40px 20px;
            display: flex;
            justify-content: center;
            min-height: calc(100vh - 100px);
            position: relative;
            z-index: 10;
        }

        .mega-wrapper {
            width: 100%;
            max-width: 1000px;
        }

        .luxury-panel {
            display: none;
            background: var(--glass);
            border: 1px solid var(--border-glow);
            border-radius: 16px;
            padding: 50px 40px;
            box-shadow: 0 30px 60px rgba(0,0,0,0.8), inset 0 0 20px rgba(212,175,55,0.05);
            backdrop-filter: blur(15px);
            animation: panelFadeIn 0.6s cubic-bezier(0.165, 0.84, 0.44, 1) forwards;
        }

        .luxury-panel.active { display: block; }

        @keyframes panelFadeIn {
            from { opacity: 0; transform: translateY(30px) scale(0.98); }
            to { opacity: 1; transform: translateY(0) scale(1); }
        }

        /* Global Structural Typography */
        .gold-heading {
            font-family: 'Cinzel', serif;
            font-size: 3.5rem;
            font-weight: 900;
            text-align: center;
            background: var(--luxury-gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 15px;
            letter-spacing: -1px;
        }

        .panel-subtitle {
            text-align: center;
            color: #c4c4c4;
            font-size: 1.1rem;
            font-weight: 300;
            letter-spacing: 2px;
            text-transform: uppercase;
            margin-bottom: 40px;
        }

        /* Generic Master Action Button */
        .gold-action-btn {
            background: var(--luxury-gradient);
            border: none;
            color: #000;
            padding: 14px 35px;
            font-weight: 700;
            font-size: 0.95rem;
            text-transform: uppercase;
            letter-spacing: 2px;
            border-radius: 4px;
            cursor: pointer;
            box-shadow: 0 6px 20px rgba(212,175,55,0.3);
            transition: all 0.3s ease;
        }

        .gold-action-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 10px 30px rgba(212,175,55,0.6);
            background: linear-gradient(135deg, #f3e5ab 0%, #aa7c11 100%);
        }

        /* ==========================================================================
           5. SECTION 1: MAIN DECK HERO (Epic Welcome Matrix)
           ========================================================================== */
        .hero-layout {
            text-align: center;
        }

        .royal-seal {
            font-size: 4.5rem;
            margin-bottom: 15px;
            animation: floatSeal 4s infinite ease-in-out;
            display: inline-block;
        }

        @keyframes floatSeal {
            0%, 100% { transform: translateY(0) rotate(0deg); }
            50% { transform: translateY(-15px) rotate(5deg); }
        }

        .luxury-quote-block {
            background: rgba(0, 0, 0, 0.4);
            border-right: 3px solid var(--gold-primary);
            border-left: 3px solid var(--gold-primary);
            padding: 30px;
            border-radius: 8px;
            margin: 35px 0;
            font-size: 1.15rem;
            line-height: 1.9;
            color: #e2e2e2;
            text-align: justify;
        }

        /* Advanced Chrono-Counter Metrics */
        .chrono-grid {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-top: 40px;
            flex-wrap: wrap;
        }

        .chrono-card {
            background: linear-gradient(145deg, #161920, #0b0c10);
            border: 1px solid rgba(212, 175, 55, 0.15);
            border-radius: 10px;
            padding: 20px;
            min-width: 110px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
            position: relative;
        }

        .chrono-value {
            font-family: 'Cinzel', serif;
            font-size: 2.2rem;
            font-weight: 900;
            color: var(--gold-light);
            display: block;
        }

        .chrono-label {
            font-size: 0.75rem;
            color: #777;
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-top: 5px;
            display: block;
        }

        /* ==========================================================================
           6. SECTION 2: 3D CAKE LAYER ASSEMBLY
           ========================================================================== */
        .cake-projection-room {
            height: 380px;
            display: flex;
            justify-content: center;
            align-items: flex-end;
            position: relative;
            padding-bottom: 20px;
        }

        .cake-architecture {
            position: relative;
            width: 280px;
            height: 90px;
            background: #1e1e24;
            border-radius: 50%;
            box-shadow: 0 15px 30px rgba(0,0,0,0.6);
            z-index: 5;
        }

        /* Tier 2 (Middle) */
        .cake-tier-mid {
            position: absolute;
            width: 220px;
            height: 80px;
            background: #2a2a35;
            border-radius: 50%;
            bottom: 40px;
            left: 30px;
            z-index: 6;
            border-bottom: 6px solid var(--gold-primary);
        }

        /* Tier 3 (Top) */
        .cake-tier-top {
            position: absolute;
            width: 160px;
            height: 70px;
            background: #363645;
            border-radius: 50%;
            bottom: 80px;
            left: 60px;
            z-index: 7;
            border-bottom: 4px solid var(--gold-light);
        }

        /* Multi-Candle Module Matrix */
        .royal-candle-array {
            position: absolute;
            width: 100%;
            height: 100%;
            z-index: 20;
            top: -45px;
            left: 0;
            pointer-events: none;
        }

        .luxury-candle-stick {
            position: absolute;
            width: 10px;
            height: 50px;
            background: linear-gradient(to right, var(--gold-dark), var(--gold-light));
            border-radius: 3px;
            cursor: pointer;
            pointer-events: auto;
        }

        /* Positioning 5 separate custom candles */
        .c-1 { bottom: 120px; left: 80px; }
        .c-2 { bottom: 135px; left: 110px; }
        .c-3 { bottom: 140px; left: 140px; }
        .c-4 { bottom: 135px; left: 170px; }
        .c-5 { bottom: 120px; left: 200px; }

        .candle-fire-orb {
            width: 12px;
            height: 22px;
            background: radial-gradient(circle, #fff 20%, #ffaa00 60%, transparent 100%);
            border-radius: 50% 50% 35% 35%;
            position: absolute;
            top: -20px;
            left: -1px;
            box-sizing: border-box;
            box-shadow: 0 0 15px #ffaa00, 0 0 30px #ff4500;
            animation: internalFlicker 0.1s infinite alternate;
            transition: all 0.25s linear;
        }

        @keyframes internalFlicker {
            0% { transform: scale(1) rotate(-1deg); }
            100% { transform: scale(1.12) rotate(2deg); }
        }

        .luxury-candle-stick.blown-out .candle-fire-orb {
            opacity: 0;
            transform: scale(0);
            pointer-events: none;
        }

        /* ==========================================================================
           7. SECTION 3: THE ARCADE MATRIX (Canvas Retro Game)
           ========================================================================== */
        .arcade-cabinet-box {
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        #arcadeScreen {
            background: #020205;
            border: 3px solid var(--gold-primary);
            box-shadow: 0 0 30px rgba(212,175,55,0.2);
            border-radius: 8px;
            max-width: 100%;
            cursor: crosshair;
        }

        .arcade-dash {
            display: flex;
            justify-content: space-between;
            width: 100%;
            max-width: 500px;
            margin-top: 20px;
            align-items: center;
        }

        .score-counter-lux {
            font-family: 'Cinzel', serif;
            font-size: 1.3rem;
            color: var(--gold-light);
            text-shadow: 0 0 10px rgba(212,175,55,0.4);
        }

        /* ==========================================================================
           8. SECTION 4: MEMORY LANE 3D CAROUSEL GALLERY
           ========================================================================== */
        .stage-3d-carousel {
            height: 350px;
            perspective: 1200px;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
        }

        .carousel-spinner {
            width: 220px;
            height: 280px;
            position: absolute;
            transform-style: preserve-3d;
            transition: transform 1s cubic-bezier(0.175, 0.885, 0.32, 1.1);
        }

        .carousel-plate {
            position: absolute;
            width: 220px;
            height: 260px;
            left: 0; top: 0;
            background: linear-gradient(45deg, #1a1c23, #101114);
            border: 2px solid var(--gold-primary);
            border-radius: 12px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 20px;
            text-align: center;
            backface-visibility: hidden;
            box-shadow: 0 10px 30px rgba(0,0,0,0.8);
        }

        /* Geometric 3D angles for 5 cards */
        .plate-1 { transform: rotateY(0deg) translateZ(300px); }
        .plate-2 { transform: rotateY(72deg) translateZ(300px); }
        .plate-3 { transform: rotateY(144deg) translateZ(300px); }
        .plate-4 { transform: rotateY(216deg) translateZ(300px); }
        .plate-5 { transform: rotateY(288deg) translateZ(300px); }

        .plate-icon { font-size: 3rem; margin-bottom: 15px; }
        .plate-title { font-family: 'Cinzel', serif; color: var(--gold-light); margin-bottom: 10px; }
        .plate-desc { font-size: 0.85rem; color: #aaa; line-height: 1.5; }

        .carousel-controls {
            display: flex;
            justify-content: center;
            gap: 30px;
            margin-top: 30px;
        }

        /* ==========================================================================
           9. SECTION 5: PREMIUM ORACLE TAROT HUB
           ========================================================================== */
        .tarot-arena {
            display: flex;
            justify-content: center;
            gap: 25px;
            flex-wrap: wrap;
        }

        .tarot-card {
            width: 160px;
            height: 260px;
            perspective: 1000px;
            cursor: pointer;
        }

        .tarot-inner {
            position: relative;
            width: 100%;
            height: 100%;
            text-align: center;
            transition: transform 0.8s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            transform-style: preserve-3d;
        }

        .tarot-card.flipped .tarot-inner {
            transform: rotateY(180deg);
        }

        .tarot-front, .tarot-back {
            position: absolute;
            width: 100%;
            height: 100%;
            backface-visibility: hidden;
            border-radius: 10px;
            border: 2px solid var(--gold-primary);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 15px;
        }

        .tarot-front {
            background: linear-gradient(135deg, #0f111a 0%, #1e2235 100%);
            color: #fff;
        }

        .tarot-front::after {
            content: "👑";
            font-size: 2.5rem;
            opacity: 0.3;
        }

        .tarot-back {
            background: linear-gradient(135deg, #1c1401 0%, #000 100%);
            color: var(--gold-light);
            transform: rotateY(180deg);
        }

        .oracle-popup-text {
            margin-top: 30px;
            text-align: center;
            font-size: 1.1rem;
            color: var(--neon-cyan);
            min-height: 30px;
            font-weight: 600;
        }

        /* ==========================================================================
           10. SECTION 6: WISH DOCK 3.0 (Advanced Storage Board)
           ========================================================================== */
        .wish-control-deck {
            display: flex;
            gap: 15px;
            margin-bottom: 40px;
        }

        .lux-input {
            flex: 1;
            background: rgba(0,0,0,0.6);
            border: 1px solid var(--border-glow);
            padding: 15px 25px;
            border-radius: 4px;
            color: #fff;
            font-size: 1rem;
            outline: none;
            transition: all 0.3s;
        }

        .lux-input:focus {
            border-color: var(--gold-primary);
            box-shadow: 0 0 15px rgba(212,175,55,0.2);
        }

        .luxury-grid-board {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
            gap: 20px;
            max-height: 400px;
            overflow-y: auto;
            padding: 10px;
        }

        .scroll-note {
            background: linear-gradient(145deg, #231f11, #0f0d07);
            border: 1px solid var(--gold-primary);
            padding: 20px;
            border-radius: 6px;
            box-shadow: 0 10px 20px rgba(0,0,0,0.5);
            position: relative;
            animation: notePop 0.4s ease-out forwards;
        }

        @keyframes notePop {
            from { transform: scale(0.8); opacity: 0; }
            to { transform: scale(1); opacity: 1; }
        }

        .scroll-n
